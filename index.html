    <div
      id="portrait-lock"
      style="display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;background:#0A0A0C;color:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:18px;font-weight:700;text-align:center;padding:24px;"
    >
      Turn your phone upright
    </div>
    <script>
      function isPhoneApp() {
        return window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      }
      function lockPortrait() {
        var orientation = screen.orientation || screen.mozOrientation || screen.msOrientation;
        if (orientation && typeof orientation.lock === "function") {
          orientation.lock("portrait").catch(function () {});
        } else if (typeof screen.lockOrientation === "function") {
          screen.lockOrientation("portrait");
        }
        var lock = document.getElementById("portrait-lock");
        var landscape = window.innerWidth > window.innerHeight;
        document.documentElement.classList.toggle("phone-app", isPhoneApp());
        document.documentElement.classList.toggle("phone-landscape", landscape);
        if (lock) lock.style.display = isPhoneApp() && landscape ? "flex" : "none";
      }
      function fitPhoneScreen() {
        var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
        if (!standalone) return;
        var height = Math.round(window.innerHeight) + "px";
        function pin(node) {
          if (!node) return;
          node.style.setProperty("position", "fixed", "important");
          node.style.setProperty("top", "0", "important");
          node.style.setProperty("right", "0", "important");
          node.style.setProperty("bottom", "auto", "important");
          node.style.setProperty("left", "0", "important");
          node.style.setProperty("width", "100%", "important");
          node.style.setProperty("height", height, "important");
          node.style.setProperty("min-height", height, "important");
        }
        pin(document.documentElement);
        pin(document.body);
        pin(document.getElementById("root"));
      }
      fitPhoneScreen();
      lockPortrait();
      window.addEventListener("resize", fitPhoneScreen);
      window.addEventListener("orientationchange", function () {
        lockPortrait();
        fitPhoneScreen();
      });
      window.addEventListener("pageshow", function () {
        lockPortrait();
        fitPhoneScreen();
      });
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitPhoneScreen);
      requestAnimationFrame(fitPhoneScreen);
      setTimeout(fitPhoneScreen, 300);
      setTimeout(fitPhoneScreen, 1000);
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register(new URL("sw.js?v=5", document.baseURI));
        });
      }
    </script>
