      /* These styles make the body full-height */
      html,

        margin: 0;
        background: #0a0a0c;

      /* These styles make the root element full-height */
      #root {
        display: flex;
        /* The document never scrolls. Absolute positioning follows its origin
           without iOS's separate fixed-element compositing/offset behavior. */
        position: absolute;
        top: var(--app-viewport-top, 0px);
        left: 0;
        width: 100%;
        height: var(--app-viewport-height, 100%);
        flex: 1;
        background: inherit;
      }
      @supports (height: 100dvh) {
        #root {
          height: var(--app-viewport-height, 100dvh);
        }
      }
      /* The keyboard already covers the home-indicator region. Safari can keep
         reporting its old inset, so do not add it again above the keyboard. */
      html.keyboard-open #app-bottom-safe-area { padding-bottom: 0 !important; }
      html.keyboard-open #app-bottom-navigation { display: none !important; }
      /* The portal's slide-transition wrapper must not establish a transformed
         fixed containing block while its form is following keyboard panning. */
      html.keyboard-open body > div:has([aria-modal="true"]) > div {
        position: absolute !important;
        top: 0 !important;
        bottom: auto !important;
        height: 100% !important;
        transform: none !important;
      }
      /* RN Web modals are portals outside #root. Size and position their
         surfaces with the same visible viewport as the app beneath them. */
      html.keyboard-open [aria-modal="true"] {
        position: absolute !important;
        top: var(--app-viewport-top, 0px) !important;
        bottom: auto !important;
        height: var(--app-viewport-height) !important;
        min-height: 0 !important;

      /* iPhone focus zoom introduces another moving viewport below 16px. */
      @media (hover: none) and (pointer: coarse) {
        input, textarea { font-size: max(16px, 1em) !important; }
      }
      /* The viewport owns the height; safe-area padding belongs to the UI.
         Avoid pinning innerHeight, which overrides dynamic viewport sizing. */
      html.phone-app.phone-landscape #portrait-lock {

    <!-- Use static rendering with Expo Router to support running without JavaScript. -->

    <div id="startup-recovery" hidden style="position:fixed;inset:0;z-index:100000;align-items:center;justify-content:center;padding:28px;background:#0A0A0C;color:#fff;text-align:center;font-family:RecoveryBarlow,sans-serif;">
      <div style="max-width:320px"><strong style="font-size:24px">SwoleMates</strong><p>The app is taking longer to load. Check your connection, then try again.</p><button id="startup-reload" style="background:#CCFF00;color:#151A08;border:0;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:600;">Reload app</button></div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        var recovery = document.getElementById("startup-recovery");
        var timer = setTimeout(function () {
          if (!root.hasChildNodes()) recovery.style.display = "flex";
        }, 15000);
        var observer = new MutationObserver(function () {
          if (root.hasChildNodes()) {
            clearTimeout(timer); recovery.style.display = "none"; observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
        document.getElementById("startup-reload").onclick = function () {
          var url = new URL(window.location.href);
          url.searchParams.set("refresh", Date.now().toString());
          window.location.replace(url.href);
        };
      })();
    </script>
    <div
      id="portrait-lock"
      style="display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;background:#0A0A0C;color:#FFFFFF;font-family:RecoveryBarlow,sans-serif;font-size:18px;font-weight:600;text-align:center;padding:24px;"
    >
      Turn your phone upright
    </div>
    <script>
      function isPhoneApp() {
        return window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      }
      function lockPortrait() {
        var orientation = screen.orientation || screen.mozOrientation || screen.msOrientation;
        if (orientation && typeof orientation.lock === "function") {
          orientation.lock("portrait").catch(function () {});
        } else if (typeof screen.lockOrientation === "function") {
          screen.lockOrientation("portrait");
        }
        var lock = document.getElementById("portrait-lock");
        // Keyboard height changes are not device rotations.
        var landscape = orientation && orientation.type
          ? orientation.type.indexOf("landscape") === 0
          : typeof window.orientation === "number"
            ? Math.abs(window.orientation) === 90
            : screen.width > screen.height;
        document.documentElement.classList.toggle("phone-app", isPhoneApp());
        document.documentElement.classList.toggle("phone-landscape", landscape);
        if (lock) lock.style.display = isPhoneApp() && landscape ? "flex" : "none";
      }
      lockPortrait();
      window.addEventListener("resize", lockPortrait);
      window.addEventListener("orientationchange", lockPortrait);
      window.addEventListener("pageshow", lockPortrait);
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          let reloadingForUpdate = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (reloadingForUpdate) return;
            reloadingForUpdate = true;
            window.location.reload();
          });
          navigator.serviceWorker.register(new URL("sw.js?v=23", document.baseURI)).then((registration) => registration.update());
        });
      }
    </script>
