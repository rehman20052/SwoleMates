    <title>SwoleMates</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a0a0c;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background: #0a0a0c;
      }
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      /* Pin the installed iPhone app to the real screen. 100dvh is Safari's
         shorter page and leaves a black gap under the tabs. */
      @media (display-mode: standalone) {
        html,
        body,
        #root {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
        }
      }
    </style>
  <link rel="icon" href="/SwoleMates/favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      function fitPhoneScreen() {
        var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
        if (!standalone) return;
        var height = Math.round(window.innerHeight) + "px";
        function pin(node) {
          if (!node) return;
          node.style.setProperty("position", "fixed", "important");
          node.style.setProperty("top", "0", "important");
          node.style.setProperty("right", "0", "important");
          node.style.setProperty("bottom", "0", "important");
          node.style.setProperty("left", "0", "important");
          node.style.setProperty("width", "100%", "important");
          node.style.setProperty("height", height, "important");
        }
        pin(document.documentElement);
        pin(document.body);
        pin(document.getElementById("root"));
      }
      fitPhoneScreen();
      window.addEventListener("resize", fitPhoneScreen);
      window.addEventListener("orientationchange", fitPhoneScreen);
      window.addEventListener("pageshow", fitPhoneScreen);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitPhoneScreen);
      requestAnimationFrame(fitPhoneScreen);
      setTimeout(fitPhoneScreen, 300);
      setTimeout(fitPhoneScreen, 1000);
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register(new URL("sw.js", document.baseURI));
        });
      }
    </script>
