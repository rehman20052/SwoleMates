    <meta name="theme-color" content="#0A0A0C" />

    <meta name="apple-mobile-web-app-title" content="SwoleMates" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>SwoleMates</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a0a0c;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background: #0a0a0c;
      }
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      /* The iPhone home-screen app reports 100dvh as the Safari height, which leaves
         a black gap under the tabs. Fill the real screen instead. */
      @media (display-mode: standalone) {
        html,
        body,
        #root {
          height: 100%;
          height: 100lvh;
          height: -webkit-fill-available;
        }
      }
    </style>
  <link rel="icon" href="/SwoleMates/favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      function fitPhoneScreen() {
        var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
        if (!standalone) return;
        var height = window.innerHeight + "px";
        document.documentElement.style.height = height;
        document.body.style.height = height;
        var root = document.getElementById("root");
        if (root) root.style.height = height;
      }
      fitPhoneScreen();
      window.addEventListener("resize", fitPhoneScreen);
      window.addEventListener("orientationchange", fitPhoneScreen);
      window.addEventListener("pageshow", fitPhoneScreen);
      requestAnimationFrame(fitPhoneScreen);
      setTimeout(fitPhoneScreen, 300);
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register(new URL("sw.js", document.baseURI));
        });
      }
    </script>
  <script src="/SwoleMates/_expo/static/js/web/entry-95e8190f7123823f0e07586ed15de8a9.js" defer></script>
</body>
